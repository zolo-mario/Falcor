name: build

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  windows-vs2022:
    name: Windows VS2022
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - config: Release
          - config: Debug
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          # sdk: 10.0.19041.0
      - name: Configure
        run: setup_vs2022.bat
        shell: cmd
      - name: Build
        run: msbuild.exe build\windows-vs2022\Falcor.sln /p:Configuration=${{ matrix.config }}
        shell: cmd

  windows-vs2026:
    name: Windows VS2026
    runs-on: windows-2025
    strategy:
      matrix:
        include:
          - config: Release
          - config: Debug
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Detect VS2026
        id: detect-vs2026
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -products * -version "[18.0,19.0)" -property installationPath | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($vsPath)) {
            "found=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Visual Studio 2026 was not found on this runner. VS2026 job steps will be skipped."
          } else {
            "found=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Found Visual Studio 2026 at: $vsPath"
          }
      - name: Setup MSVC
        if: steps.detect-vs2026.outputs.found == 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        if: steps.detect-vs2026.outputs.found == 'true'
        run: setup_vs2026.bat
        shell: cmd
      - name: Build
        if: steps.detect-vs2026.outputs.found == 'true'
        run: msbuild.exe build\windows-vs2026\Falcor.sln /p:Configuration=${{ matrix.config }}
        shell: cmd
      - name: Skip notice
        if: steps.detect-vs2026.outputs.found != 'true'
        run: echo "Skipping Windows VS2026 build because Visual Studio 2026 is unavailable on this runner."
        shell: cmd

